<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=League+Spartan">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
</head>

<style>
    span { color: #28c986; }
</style>

<body>
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="form-container text-center">
            <img src="image/Rubenian-Logo-344.png" width="100" height="100" alt="Logo">
            <h1 class="form-title">Register</h1>
            <p>Create your account</p>
            <form class="form">
                <label>
                    <input required type="text" class="input" placeholder="">
                    <span>Last Name</span>
                </label>
                <label>
                    <input required type="text" class="input" placeholder="">
                    <span>Middle Name</span>
                </label>
                <label>
                    <input required type="text" class="input" placeholder="">
                    <span>First Name</span>
                </label>
                <label>
                    <input required type="text" class="input" placeholder="">
                    <span>Username</span>
                </label>
                <label>
                    <input required type="password" class="input" placeholder="">
                    <span>Password</span>
                </label>
                <label>
                    <input required type="text" class="input" placeholder="">
                    <span>Department</span>
                </label>
                <label>
                    <input required type="text" class="input" placeholder="">
                    <span>Position</span>
                </label>
                <label>
                    <input required type="text" class="input" placeholder="">
                    <span>Location</span>
                </label>
                <label>
                    <input required type="text" class="input" placeholder="">
                    <span>Staff ID</span>
                </label>
                <label>
                    <input required type="text" class="input" placeholder="">
                    <span>Access Level</span>
                </label>

                <button class="submit">Register</button>

                <!-- Link to Login -->
                <div class="extra-links">
                    <a href="login.html">Already have an account? Login</a>
                </div>
            </form>
        </div>
    </div>

    <footer class="text-center text-lg-start">
        <div class="container pb-2">
            <div class="row d-flex justify-content-center">
                <div class="col-md-6 text-md-left text-center">
                    <p class="mb-0">&copy; 2024 Rubenian Membership Portal. Made with <span><i class="fa-solid fa-heart"></i></span> by <span>BehindWeb</span>.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
